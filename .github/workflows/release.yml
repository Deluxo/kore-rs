name: Build Linux ARM64

on:
  push:
    branches: [ "main" ]

jobs:
  build-arm64:
    name: Build (Linux ARM64)
    runs-on: ubuntu-22.04-arm

    env:
      PROJECT_NAME: korers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # System dependencies (GTK4 stack)
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libavahi-compat-libdnssd-dev
      # ----------------------------
      # Rust toolchain
      # ----------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # Optional caching (speeds up rebuilds)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ----------------------------
      # Build release binary
      # ----------------------------
      - name: Build release
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu

      # ----------------------------
      # Package artifact
      # ----------------------------
      - name: Package binary
        run: |
          BIN_OUTPUT="target/aarch64-unknown-linux-gnu/release/${PROJECT_NAME}"
          mkdir -p dist
          cp "$BIN_OUTPUT" "dist/${PROJECT_NAME}-linux-arm64"

      # ----------------------------
      # Upload artifact
      # ----------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: korers-linux-arm64
          path: dist/
